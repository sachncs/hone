[project]
name = "finetune-pipeline"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "pyyaml>=6.0",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
finetune-prepare-data = "finetune.cli:prepare_data_main"

[project.optional-dependencies]
dev = [
  "mypy>=1.13",
  "pytest>=8.3",
  "ruff>=0.8",
]
mlx = [
  "mlx-lm[train]>=0.29.0",
  "datasets>=3.0",
]
cuda = [
  "torch>=2.5",
  "datasets>=3.0",
  "transformers>=4.57.3,<5",
  "trl>=0.18",
  "peft>=0.14",
  "unsloth",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py312"
line-length = 88
include = ["scripts/*.py", "tests/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["finetune"]

[tool.mypy]
explicit_package_bases = true
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
