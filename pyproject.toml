[project]
name = "hone"
version = "0.3.0"
description = "Soup-ready JSONL data preparation for supervised fine-tuning."
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "Sachin" }]
readme = "README.md"
keywords = ["soup", "finetune", "data-prep", "jsonl", "huggingface"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "datasets>=5.0.1",
  "huggingface-hub>=1.29.0,<2.0",
]

[project.urls]
Homepage = "https://github.com/sachncs/hone"
Repository = "https://github.com/sachncs/hone"
Issues = "https://github.com/sachncs/hone/issues"

[project.optional-dependencies]
dev = [
  "mypy>=2.3.0",
  "pytest>=8.3",
  "ruff>=0.16.1",
]
soup = ["soup-cli[mlx]"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hone", "hone.prepare"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 88
include = ["hone/**/*.py", "tests/**/*.py"]
extend-exclude = ["build", "dist", "archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["hone"]

[tool.mypy]
explicit_package_bases = true
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
