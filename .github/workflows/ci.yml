name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linux:
    name: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
      - name: Set up Python
        run: uv python install 3.12
      - name: Install development dependencies
        run: uv sync --extra dev
      - name: Run tests (no mlx)
        run: uv run pytest -m "not mlx"
      - name: Check formatting
        run: uv run ruff format --check hone tests
      - name: Run lint
        run: uv run ruff check hone tests
      - name: Run type checking
        run: uv run mypy hone tests

  apple:
    name: apple
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
      - name: Set up Python
        run: uv python install 3.12
      - name: Install development and MLX dependencies
        run: uv sync --extra dev --extra mlx
      - name: Run tests (full suite including mlx)
        run: uv run pytest
      - name: Check formatting
        run: uv run ruff format --check hone tests
      - name: Run lint
        run: uv run ruff check hone tests
      - name: Run type checking
        run: uv run mypy hone tests
