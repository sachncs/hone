model: openbmb/MiniCPM5-1B
train: true
fine_tune_type: lora
data: data/processed/code
seed: 42
num_layers: 1
batch_size: 1
grad_accumulation_steps: 1
iters: 2
val_batches: 1
learning_rate: 0.0001
adapter_path: artifacts/smoke-lora
save_every: 1
max_seq_length: 256
grad_checkpoint: true
mask_prompt: true
lora_parameters:
  keys: [self_attn.q_proj, self_attn.v_proj]
  rank: 4
  scale: 16.0
  dropout: 0.05
