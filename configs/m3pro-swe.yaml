model: mlx-community/MiniCPM5-1B-4bit
train: true
fine_tune_type: lora
data: data/processed/swe
seed: 42
num_layers: 8
batch_size: 1
grad_accumulation_steps: 16
iters: 1000
val_batches: 25
learning_rate: 0.000008
adapter_path: artifacts/swe-lora
save_every: 200
max_seq_length: 4096
grad_checkpoint: true
mask_prompt: true
lora_parameters:
  keys: [self_attn.q_proj, self_attn.v_proj]
  rank: 8
  scale: 16.0
  dropout: 0.05
