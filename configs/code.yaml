model: openbmb/MiniCPM5-1B
train: true
fine_tune_type: lora
data: data/processed/code
seed: 42
num_layers: 12
batch_size: 1
grad_accumulation_steps: 8
iters: 1200
val_batches: 25
learning_rate: 0.00001
adapter_path: artifacts/code-lora
save_every: 200
max_seq_length: 3072
grad_checkpoint: true
mask_prompt: true
lora_parameters:
  keys: [self_attn.q_proj, self_attn.v_proj]
  rank: 8
  scale: 16.0
  dropout: 0.05
