model: openbmb/MiniCPM5-1B
train: true
fine_tune_type: lora
data: data/full/kimi
seed: 42
num_layers: 2
batch_size: 1
grad_accumulation_steps: 4
iters: 50
val_batches: 5
learning_rate: 0.00002
adapter_path: artifacts/smoke-kimi-lora
save_every: 25
max_seq_length: 2048
grad_checkpoint: true
mask_prompt: true
lora_parameters:
  keys: [self_attn.q_proj, self_attn.v_proj]
  rank: 4
  scale: 8.0
  dropout: 0.05