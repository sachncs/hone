# Soup config — Curriculum learning Stage 2: Ling-Coder (continuation)
#
# Continues from artifacts/soup-curriculum-codex/adapters.safetensors
# and trains on a 1500-row stratified Ling-Coder subset (~1425 Soup
# iters after 5% val_split). This is stage 2 of the curriculum
# experiment; stage 1 is configs/soup-sft-curriculum-codex.yaml.
#
# Why this exists:
#   See the rationale in configs/soup-sft-curriculum-codex.yaml.
#   This stage teaches the CodeX-pretrained model a second,
#   instruction-style distribution (Ling-Coder) without overwriting
#   the function-completion patterns from stage 1.
#
# IMPORTANT: Soup MLX computes iters = epochs * rows/batch_size,
# IGNORING the explicit `iters` field. The 1500-row data file
# produces 1425 Soup iters for ~20 min on M3 Pro 18 GB.

base: openbmb/MiniCPM5-1B-MLX
backend: mlx
task: sft

data:
  train: data/soup/lingcoder/train-1k5.jsonl
  format: chatml
  max_length: 2048
  val_split: 0.05
  train_on_responses_only: true

training:
  epochs: 1
  # Slightly lower LR than stage 1 to avoid overwriting the
  # CodeX-pretrained patterns.
  lr: 1.0e-5
  batch_size: 1
  gradient_accumulation_steps: 16
  gradient_checkpointing: true
  seed: 1234
  logging_steps: 50
  save_steps: 500
  # Continue from the CodeX-pretrained adapter. Soup's
  # resume_from_checkpoint is wired through the train CLI
  # (--resume-adapter-file); train-soup.sh passes this flag.
  lora:
    r: 16
    alpha: 32
    dropout: 0.05
    target_modules:
      - self_attn.q_proj
      - self_attn.v_proj

output: artifacts/soup-curriculum-lingcoder
