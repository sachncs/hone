# Soup config — Curriculum learning Stage 1: CodeX
#
# Trains MiniCPM5-1B-MLX on a 5500-row stratified CodeX subset
# (~5225 Soup iters after 5% val_split). The output adapter is
# the input to configs/soup-sft-curriculum-lingcoder.yaml.
#
# Why this exists:
#   Curriculum learning tests whether *data ordering* matters.
#   We train on the more uniform distribution first (CodeX
#   competitive-programming instructions), then continue on the
#   more diverse distribution (Ling-Coder). If CodeX first gives
#   the model a stable foundation and Ling-Coder broadens its
#   coverage, the final numbers should beat the single-pass
#   combined SFT in docs/ABLATION-REPORT.md.
#
# IMPORTANT: Soup MLX computes iters = epochs * rows/batch_size,
# IGNORING the explicit `iters` field. This config uses a 5500-row
# data file (val_split 5% → 5225 train rows → 5225 Soup iters) to
# land at the desired wall-clock of ~80 min on M3 Pro 18 GB.

base: openbmb/MiniCPM5-1B-MLX
backend: mlx
task: sft

data:
  train: data/soup/codex/train-5k.jsonl
  format: chatml
  max_length: 2048
  val_split: 0.05
  train_on_responses_only: true

training:
  epochs: 1
  lr: 2.0e-5
  batch_size: 1
  gradient_accumulation_steps: 16
  gradient_checkpointing: true
  seed: 1234
  logging_steps: 100
  save_steps: 1000
  lora:
    r: 16
    alpha: 32
    dropout: 0.05
    target_modules:
      - self_attn.q_proj
      - self_attn.v_proj

output: artifacts/soup-curriculum-codex
